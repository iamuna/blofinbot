name: Validation data (coins outside the top-20, incl. delisted)

# Out-of-universe test set for the multi-timeframe system: large coins from 2020–2024 that are NOT in
# the live top-20, including coins that collapsed or were delisted (LUNA, FTT, SRM, MATIC …), so the
# method is judged on survivors and casualties alike. 1h candles + funding, published on `validation-data`.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validation-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT_DIR: validation
      FIVE_MIN_MONTHS: "0"
      COINS: "LTC,BCH,ADA,LINK,DOT,AVAX,MATIC,ATOM,UNI,FIL,ETC,EOS,XLM,ALGO,AAVE,LUNA,FTT,SRM,AXS,SAND,MANA,CRV,ICP,APT,ARB,OP,BNB,WAVES,CHZ,GALA"
    steps:
      - uses: actions/checkout@v4
      - name: Build dataset
        continue-on-error: true
        run: python3 tools/research_data.py
      - name: Publish to validation-data branch
        if: always()
        run: |
          set -e
          mkdir -p validation
          [ -f validation/manifest.json ] || echo '{"status":"failed","error":"builder produced no manifest"}' > validation/manifest.json
          cd validation
          git init -q -b validation-data
          git config user.name "blofinbot research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "validation data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" validation-data
