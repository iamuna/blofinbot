name: Swarm factory (tester + promotion gate)

# Backtests every configured strategy and every candidate in swarm/factory/candidates on the swarm dataset, logs
# each try (the multiple-testing count) and applies the backtest gate. Results go to the swarm-factory branch.
# Promotion: rule v2 (swarm/src/factory/promote_v2.js, upswarm GUIDE §9) — the 5-year sweep and the era test select,
# the live record only vetoes. It runs as a DRY RUN: its report goes to swarm-factory PROMOTION.md and nothing is
# written to swarm-state/control.json (the old gate's shadow → trade route judged a few days of shadow, the thing the
# guide's replay showed loses money). Switching rule v2 on is Ibrahim's call after two weeks of dry runs.

on:
  push:
    branches: [main]
    paths: ["swarm/factory/candidates/**", "swarm/src/strategies/**", "swarm/src/analysis/**", "swarm/src/backtest/**", "swarm/src/factory/**", ".github/workflows/swarm-factory.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swarm-factory
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # strategy plugins (agent-written code) run in the test step: no credentials are left on disk for them —
      # the token appears only in the steps that fetch and publish
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Fetch data, factory log and live state
        run: |
          R="https://github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch swarm-data "$R" data
          git clone -q --depth 1 --branch swarm-factory "$R" factory 2>/dev/null || { mkdir factory && git -C factory init -q -b swarm-factory && git -C factory remote add origin "$R"; }
          git clone -q --depth 1 --branch swarm-state "$R" state 2>/dev/null || echo "no swarm-state branch yet (home PC not running)"
      - name: Test strategies and candidates
        run: node --max-old-space-size=6000 swarm/src/factory/test_candidates.js --data data --out factory --split "$(date -u -d '45 days ago' +%F)"
      - name: Publish results
        run: |
          cd factory && git config user.name "swarm tester" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "factory test $(date -u +%FT%TZ) for ${{ github.sha }}" || { echo "nothing new"; exit 0; }
          # others append to trials.jsonl too (log_tries.js): rebase onto them before pushing
          W="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull -q --rebase "$W" swarm-factory && git push -q "$W" HEAD:swarm-factory && exit 0; sleep 5; done; exit 1
      - name: Promotion rule v2 (dry run — report only)
        if: hashFiles('state/state.json') != ''
        run: |
          R="https://github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch swarm-reports "$R" reports || { echo "no swarm-reports branch"; exit 0; }
          era=$(ls -d reports/era/*/results.json 2>/dev/null | sort | tail -1)
          node swarm/src/factory/promote_v2.js --state state --sweep reports/history ${era:+--era "$era"} --factory factory --out factory/PROMOTION.md > /dev/null
          cd factory && git config user.name "swarm promotion v2 (dry run)" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROMOTION.md && git commit -q -m "promotion rule v2 dry run $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          W="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull -q --rebase "$W" swarm-factory && git push -q "$W" HEAD:swarm-factory && exit 0; sleep 5; done; exit 1
