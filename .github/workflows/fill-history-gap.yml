name: Fill BTCUSDT 1m history gap

# Rebuilds Binance BTCUSDT 1m candles from 2025-10-11 11:00 UTC (end of the source ZIP)
# to the latest closed minute, from Binance's public bulk archive, and publishes the
# result on the `history-data` branch (single commit, replaced on every run).

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_binance_archive.py"
      - ".github/workflows/fill-history-gap.yml"
  schedule:
    - cron: "17 3 * * *" # daily, after Binance publishes the previous day's archive
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fill-history-gap
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and assemble the gap
        id: build
        continue-on-error: true
        run: python3 tools/fetch_binance_archive.py

      - name: Publish to history-data branch
        if: always()
        run: |
          set -e
          mkdir -p publish
          cp output/BTCUSDT_1m_gap_manifest.json publish/ 2>/dev/null || echo '{"status":"failed","error":"manifest missing"}' > publish/BTCUSDT_1m_gap_manifest.json
          cp output/BTCUSDT_1m_gap_20251011_to_latest.zip publish/ 2>/dev/null || true
          cat > publish/README.md <<'EOF'
          # history-data

          Binance spot BTCUSDT 1-minute candles from 2025-10-11 11:00 UTC to the latest
          closed minute, rebuilt daily by `.github/workflows/fill-history-gap.yml`.
          Same format as `tools/build_btc_gap.py`; merge with `tools/merge_btc_gap.py`.
          See the manifest for row counts, gaps and checksums.
          EOF
          cd publish
          git init -q -b history-data
          git config user.name "blofinbot history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "history: $(python3 -c 'import json;m=json.load(open("BTCUSDT_1m_gap_manifest.json"));print(m.get("status"),m.get("last_closed_candle_utc",""),m.get("rows",""))')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" history-data
