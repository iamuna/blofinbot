name: Swarm CI (tests + live data smoke run)

# Tests the multi-agent swarm on every push to main: unit tests (with a real Redis), then a short
# live run of the market-data agents against BloFin's public feed, summarised from the recording.
# Binance usually refuses US-based runners, so here the universe comes from Binance's public archive and the
# Binance feed is expected to report itself degraded. No keys, no orders.

on:
  push:
    branches: [main]
    paths: ["swarm/**", ".github/workflows/swarm-ci.yml"]
  # (the windows job below runs the Windows install the way Ibrahim's PC does: no Ubuntu, one process)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Smoke run length (minutes)"
        default: "4"

permissions:
  contents: write   # the smoke job publishes its report to the swarm-reports branch

concurrency:
  group: swarm-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # the swarm's code runs here; no token on disk
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests
        working-directory: swarm
        env: { REDIS_URL: "redis://127.0.0.1:6379" }
        run: npm test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # the swarm's code runs here; no token on disk
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Live market-data run
        run: |
          # the whole swarm in one process; the probe strategy trades tiny on the paper account to exercise the trade path
          echo '{"extraStrategies":["probe"],"strategies":{"probe":{"mode":"trade"}},"trading":{"account":"paper"}}' > /tmp/sw-local.json
          # with a bus key, as on the home PC: orders, commands and account updates are signed and checked
          node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))' > /tmp/sw-bus.key
          SWARM_BUS_KEY_FILE=/tmp/sw-bus.key SWARM_LOCAL_CONFIG=/tmp/sw-local.json node swarm/src/run.js --agents universe,blofin-feed,binance-feed,guard,recorder,events,brain,coordinator,trader,accountant,watchdog,guardian,herald,state-sync --bus memory --data-dir /tmp/sw --minutes "${{ github.event.inputs.minutes || '8' }}" --log-samples > /tmp/sw-run.log 2>&1 || true
          tail -n 60 /tmp/sw-run.log
      - name: Report
        run: |
          set +e
          node swarm/src/tools/smoke_report.js /tmp/sw > /tmp/sw-report.md; code=$?
          cat /tmp/sw-report.md; cat /tmp/sw-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "$code" > /tmp/sw-code
      - name: Publish report to swarm-reports
        if: always()
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch swarm-reports "$R" rep 2>/dev/null || { mkdir rep && git -C rep init -q -b swarm-reports && git -C rep remote add origin "$R"; }
          mkdir -p rep/smoke
          cp /tmp/sw-report.md rep/smoke/latest.md || true
          grep -v '"level":"debug"' /tmp/sw-run.log | tail -n 400 > rep/smoke/latest-log.txt || true
          cp /tmp/sw/state/universe.json rep/smoke/universe.json 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }} $(date -u +%FT%TZ)" > rep/smoke/latest-run.txt
          cd rep && git config user.name "swarm ci" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "smoke report ${{ github.run_id }}" && git push -q origin HEAD:swarm-reports
      - name: Fail if the BloFin data path is broken
        run: exit "$(cat /tmp/sw-code)"
      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke
          path: |
            /tmp/sw-run.log
            /tmp/sw-report.md
            /tmp/sw/state
            /tmp/sw/rec
          retention-days: 7

  windows:
    # The Windows version (no Ubuntu): unit tests on Windows, then install.ps1 without prompts or logon task, and
    # run.ps1 live on BloFin's feed for a few minutes with the probe strategy trading on paper.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem swarm/deploy/windows/*.ps1) {
            $errs = $null; $toks = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$toks, [ref]$errs) | Out-Null
            if ($errs) { $bad++; foreach ($e in $errs) { Write-Host "$($f.Name): $($e.Message) at line $($e.Extent.StartLineNumber)" } } else { Write-Host "$($f.Name): ok" }
          }
          if ($bad) { exit 1 }
      - name: Unit tests on Windows
        working-directory: swarm
        run: npm test
      - name: Install and run the Windows version live for 5 minutes
        shell: powershell
        env:
          SWARM_ROOT: C:\swarm-ci
          SWARM_BRANCH: ci-head
          SWARM_NO_PROMPT: "1"
          SWARM_NO_TASK: "1"
          SWARM_RUN_MINUTES: "5"
        run: |
          git branch ci-head
          $env:SWARM_SOURCE = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path C:\swarm-ci | Out-Null
          [IO.File]::WriteAllText('C:\swarm-ci\swarm.local.json', '{"extraStrategies":["probe"],"strategies":{"probe":{"mode":"trade"}},"trading":{"account":"paper"}}')
          & .\swarm\deploy\windows\install.ps1
          & C:\swarm-ci\app\swarm\deploy\windows\run.ps1
          Write-Host '--- runner.log'; Get-Content C:\swarm-ci\logs\runner.log
          $log = Get-ChildItem C:\swarm-ci\logs\swarm-*.log | Where-Object { $_.Name -notlike '*.err.log' } | Sort-Object LastWriteTime | Select-Object -Last 1
          Write-Host "--- $($log.Name) (last 40 lines)"; Get-Content $log.FullName -Tail 40
          $err = Get-ChildItem C:\swarm-ci\logs\swarm-*.err.log | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($err -and (Get-Item $err.FullName).Length -gt 0) { Write-Host "--- $($err.Name)"; Get-Content $err.FullName -Tail 40 }
          node swarm/src/tools/smoke_report.js C:\swarm-ci\data
          if ($LASTEXITCODE -ne 0) { exit 1 }
