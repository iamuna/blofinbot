name: Swarm CI (tests + live data smoke run)

# Tests the multi-agent swarm on every push to the swarm branch: unit tests (with a real Redis), then a short
# live run of the market-data agents against BloFin's public feed, summarised from the recording.
# Binance usually refuses US-based runners, so here the universe comes from Binance's public archive and the
# Binance feed is expected to report itself degraded. No keys, no orders.

on:
  push:
    branches: [swarm]
    paths: ["swarm/**", ".github/workflows/swarm-ci.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Smoke run length (minutes)"
        default: "4"

permissions:
  contents: write   # the smoke job publishes its report to the swarm-reports branch

concurrency:
  group: swarm-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests
        working-directory: swarm
        env: { REDIS_URL: "redis://127.0.0.1:6379" }
        run: npm test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Live market-data run
        run: |
          # the whole swarm in one process; the probe strategy trades tiny on the paper account to exercise the trade path
          echo '{"extraStrategies":["probe"],"strategies":{"probe":{"mode":"trade"}},"trading":{"account":"paper"}}' > /tmp/sw-local.json
          SWARM_LOCAL_CONFIG=/tmp/sw-local.json node swarm/src/run.js --agents universe,blofin-feed,binance-feed,guard,recorder,events,brain,coordinator,trader,accountant,watchdog,guardian,herald,state-sync --bus memory --data-dir /tmp/sw --minutes "${{ github.event.inputs.minutes || '8' }}" --log-samples > /tmp/sw-run.log 2>&1 || true
          tail -n 60 /tmp/sw-run.log
      - name: Report
        run: |
          set +e
          node swarm/src/tools/smoke_report.js /tmp/sw > /tmp/sw-report.md; code=$?
          cat /tmp/sw-report.md; cat /tmp/sw-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "$code" > /tmp/sw-code
      - name: Publish report to swarm-reports
        if: always()
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch swarm-reports "$R" rep 2>/dev/null || { mkdir rep && git -C rep init -q -b swarm-reports && git -C rep remote add origin "$R"; }
          mkdir -p rep/smoke
          cp /tmp/sw-report.md rep/smoke/latest.md || true
          grep -v '"level":"debug"' /tmp/sw-run.log | tail -n 400 > rep/smoke/latest-log.txt || true
          cp /tmp/sw/state/universe.json rep/smoke/universe.json 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }} $(date -u +%FT%TZ)" > rep/smoke/latest-run.txt
          cd rep && git config user.name "swarm ci" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "smoke report ${{ github.run_id }}" && git push -q origin HEAD:swarm-reports
      - name: Fail if the BloFin data path is broken
        run: exit "$(cat /tmp/sw-code)"
      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-smoke
          path: |
            /tmp/sw-run.log
            /tmp/sw-report.md
            /tmp/sw/state
            /tmp/sw/rec
          retention-days: 7
