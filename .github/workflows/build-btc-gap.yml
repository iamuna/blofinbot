name: Build BTCUSDT 1m gap dataset

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/build_btc_gap.py"
      - ".github/workflows/build-btc-gap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python
        shell: powershell
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python is not available on PATH"
            exit 1
          }

      - name: Download and validate Binance spot 1m history gap
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          python tools/build_btc_gap.py *> output/build.log
          $code = $LASTEXITCODE
          Set-Content -Path output/exit_code.txt -Value $code
          Get-Content output/build.log
          exit 0

      - name: Upload gap dataset and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-1m-gap
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Fail job if builder failed
        shell: powershell
        run: |
          $code = (Get-Content output/exit_code.txt).Trim()
          if ($code -ne "0") {
            Write-Error "build_btc_gap.py failed with exit code $code"
            exit 1
          }
